<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar · the Daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800;900&family=Bodoni+Moda:ital,wght@0,700;0,900;1,700;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="pages/calendar.css">
</head>
<body class="page-calendar">

<div class="speak-o-meter" aria-hidden="true">
  <div class="wave-active-bar" id="waveActiveBar"></div>
</div>

<nav class="topnav">
  <div class="topnav-inner">
    <a href="index.html" class="topnav-brand">
      <svg viewBox="0 0 40 40" width="26" height="26" aria-hidden="true">
        <defs>
          <linearGradient id="lipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF3D8B"/>
            <stop offset="100%" stop-color="#B8306B"/>
          </linearGradient>
        </defs>
        <path d="M20 12 C 15 6, 6 8, 6 16 C 6 22, 12 28, 20 34 C 28 28, 34 22, 34 16 C 34 8, 25 6, 20 12 Z" fill="url(#lipGrad)"/>
      </svg>
      the Daily
    </a>
    <div class="topnav-links">
      <a href="index.html"    class="nav-link"><span class="nav-num">01</span><span class="nav-name">Speak</span></a>
      <a href="wordbook.html" class="nav-link"><span class="nav-num">02</span><span class="nav-name">Wordbook</span></a>
      <a href="calendar.html" class="nav-link active"><span class="nav-num">03</span><span class="nav-name">Calendar</span></a>
      <a href="finance.html"  class="nav-link"><span class="nav-num">04</span><span class="nav-name">Finance</span></a>
      <a href="vibe.html"     class="nav-link"><span class="nav-num">05</span><span class="nav-name">Vibe</span></a>
    </div>
  </div>
</nav>

<div class="bg-shapes" aria-hidden="true">
  <span class="shape shape-1"></span>
  <span class="shape shape-2"></span>
  <span class="shape shape-3"></span>
</div>

<main class="page">

  <header class="page-head">
    <div class="page-head-left">
      <div class="date-block">
        <span class="date-day" id="dateDay">SAT</span>
        <span class="date-num" id="dateNum">01</span>
        <span class="date-mo"  id="dateMo">AUG</span>
      </div>
      <div class="page-title-block">
        <span class="page-eyebrow">no. 03 · calendar</span>
        <h1 class="page-title">the countdown <em>desk.</em></h1>
      </div>
    </div>
    <div class="page-head-right">
      <span id="totalEvents" style="font-family: var(--font-accent); font-style: italic; font-weight: 900; color: var(--white); font-size: 1.4rem;">0 plans</span>
    </div>
  </header>

  <!-- Add event form -->
  <section class="cal-add">
    <div class="cal-add-head">
      <span class="section-label">add a new plan</span>
    </div>
    <form class="cal-form" id="addForm">
      <input class="cal-input" type="text" id="eventName" placeholder="what's the plan?" required maxlength="60">
      <input class="cal-input" type="date" id="eventDate" required>
      <select class="cal-input" id="eventEmoji" aria-label="pick an emoji">
        <option value="\u{1F338}">🌸 general</option>
        <option value="\u2708\uFE0F">✈️ trip</option>
        <option value="\u{1F393}">🎓 exam</option>
        <option value="\u{1F4BC}">💼 work</option>
        <option value="\u{1F389}">🎉 party</option>
        <option value="\u{1F495}">💕 date</option>
        <option value="\u{1F4B0}">💰 money</option>
        <option value="\u{1F4AA}">💪 fitness</option>
        <option value="\u{1F4DA}">📚 study</option>
        <option value="\u{1F484}">💄 beauty</option>
      </select>
      <button class="cal-btn" type="submit">+ add plan</button>
    </form>
  </section>

  <!-- Events list -->
  <section class="cal-events">
    <div class="cal-events-head">
      <span class="section-label">upcoming</span>
    </div>
    <div class="cal-list" id="eventsList">
      <div class="cal-empty">
        <p>no plans yet. add your first one above.</p>
      </div>
    </div>
  </section>

  <!-- Past events (collapsed) -->
  <section class="cal-past" id="pastSection" style="display:none;">
    <div class="cal-events-head">
      <span class="section-label">past</span>
    </div>
    <div class="cal-list" id="pastList"></div>
  </section>

</main>

<footer class="page-footer">
  <p>counting down to the things you're waiting for.</p>
</footer>

<script src="script.js"></script>
<script src="pages/calendar.js"></script>
</body>
</html>
