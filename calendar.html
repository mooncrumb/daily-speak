<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar · the Daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800;900&family=Bodoni+Moda:ital,wght@0,700;0,900;1,700;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="calendar.css">
</head>
<body class="page-calendar">

<div class="speak-o-meter" aria-hidden="true">
  <div class="wave-active-bar" id="waveActiveBar"></div>
</div>

<div class="bg-shapes" aria-hidden="true">
  <span class="shape shape-1"></span>
  <span class="shape shape-2"></span>
  <span class="shape shape-3"></span>
  <span class="shape shape-4"></span>
</div>

<div class="floating-words" aria-hidden="true">
  <span class="fw fw-1">soon</span>
  <span class="fw fw-2">countdown</span>
  <span class="fw fw-3">plans</span>
  <span class="fw fw-4">iykyk</span>
  <span class="fw fw-5">save the date</span>
  <span class="fw fw-6">era</span>
  <span class="fw fw-7">booked</span>
</div>

<nav class="topnav">
  <div class="topnav-inner">
    <a href="index.html" class="topnav-brand">
      <svg viewBox="0 0 40 40" width="28" height="28" aria-hidden="true">
        <defs>
          <linearGradient id="lipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF3D8B"/>
            <stop offset="100%" stop-color="#B8306B"/>
          </linearGradient>
        </defs>
        <path d="M20 12 C 15 6, 6 8, 6 16 C 6 22, 12 28, 20 34 C 28 28, 34 22, 34 16 C 34 8, 25 6, 20 12 Z" fill="url(#lipGrad)"/>
      </svg>
      the Daily
    </a>
    <div class="topnav-links">
      <a href="index.html"    class="nav-link">speak</a>
      <a href="wordbook.html" class="nav-link">wordbook</a>
      <a href="calendar.html" class="nav-link active">calendar</a>
      <a href="finance.html"  class="nav-link">finance</a>
      <a href="vibe.html"     class="nav-link">vibe</a>
    </div>
  </div>
</nav>

<main class="page">

  <header class="page-head">
    <div class="page-head-left">
      <div class="date-block">
        <span class="date-day" id="dateDay">SAT</span>
        <span class="date-num" id="dateNum">01</span>
        <span class="date-mo"  id="dateMo">AUG</span>
      </div>
      <div class="page-title-block">
        <span class="page-eyebrow">calendar</span>
        <h1 class="page-title">the countdown <em>desk.</em></h1>
      </div>
    </div>
    <div class="page-head-right">
      <span id="totalEvents" style="font-family: var(--font-accent); font-style: italic; font-weight: 900; color: var(--white); font-size: 1.5rem;">0 plans</span>
    </div>
  </header>

  <!-- BIG COUNTDOWN HERO (nearest event) -->
  <section class="hero-countdown" id="heroCountdown"></section>

  <!-- MONTH VIEW -->
  <section class="month-section">
    <div class="month-head">
      <button class="month-nav" id="prevMonth" type="button" aria-label="Previous month">‹</button>
      <h2 class="month-title" id="monthTitle">August 2026</h2>
      <button class="month-nav" id="nextMonth" type="button" aria-label="Next month">›</button>
    </div>

    <div class="weekdays">
      <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
    </div>

    <div class="month-grid" id="monthGrid"></div>
  </section>

  <!-- ADD FORM -->
  <section class="cal-add">
    <div class="cal-add-head">
      <span class="section-label">drop a new plan</span>
    </div>
    <form class="cal-form" id="addForm">
      <input class="cal-input" type="text" id="eventName" placeholder="what's the plan?" required maxlength="60">
      <input class="cal-input" type="date" id="eventDate" required>
      <select class="cal-input" id="eventEmoji" aria-label="emoji">
        <option value="🌸">🌸 general</option>
        <option value="✈️">✈️ trip</option>
        <option value="🎓">🎓 exam</option>
        <option value="💼">💼 work</option>
        <option value="🎉">🎉 party</option>
        <option value="💕">💕 date</option>
        <option value="💰">💰 money</option>
        <option value="💪">💪 fitness</option>
        <option value="📚">📚 study</option>
        <option value="💄">💄 beauty</option>
        <option value="🍸">🍸 night out</option>
        <option value="🎂">🎂 birthday</option>
      </select>
      <button class="cal-btn" type="submit">+ book it</button>
    </form>
  </section>

  <!-- UPCOMING LIST -->
  <section class="cal-events">
    <div class="cal-events-head">
      <span class="section-label">upcoming</span>
    </div>
    <div class="cal-list" id="eventsList"></div>
  </section>

</main>

<footer class="page-footer">
  <p>counting down to the things you're waiting for.</p>
</footer>

<script src="script.js"></script>
<script src="calendar.js"></script>
</body>
</html>
