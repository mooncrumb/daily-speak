<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wordbook · the Daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800;900&family=Bodoni+Moda:ital,wght@0,700;0,900;1,700;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="wordbook.css">
</head>
<body class="page-wordbook">

<div class="speak-o-meter" aria-hidden="true">
  <div class="wave-active-bar" id="waveActiveBar"></div>
</div>

<div class="bg-shapes" aria-hidden="true">
  <span class="shape shape-1"></span>
  <span class="shape shape-2"></span>
  <span class="shape shape-3"></span>
  <span class="shape shape-4"></span>
</div>

<div class="floating-words" aria-hidden="true">
  <span class="fw fw-1">smart girl</span>
  <span class="fw fw-2">iykyk</span>
  <span class="fw fw-3">era</span>
  <span class="fw fw-4">vocab</span>
  <span class="fw fw-5">lock in</span>
  <span class="fw fw-6">that girl</span>
  <span class="fw fw-7">study</span>
</div>

<nav class="topnav">
  <div class="topnav-inner">
    <a href="index.html" class="topnav-brand">
      <svg viewBox="0 0 40 40" width="28" height="28" aria-hidden="true">
        <defs>
          <linearGradient id="lipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF3D8B"/>
            <stop offset="100%" stop-color="#B8306B"/>
          </linearGradient>
        </defs>
        <path d="M20 12 C 15 6, 6 8, 6 16 C 6 22, 12 28, 20 34 C 28 28, 34 22, 34 16 C 34 8, 25 6, 20 12 Z" fill="url(#lipGrad)"/>
      </svg>
      the Daily
    </a>
    <div class="topnav-links">
      <a href="index.html"    class="nav-link">speak</a>
      <a href="wordbook.html" class="nav-link active">wordbook</a>
      <a href="calendar.html" class="nav-link">calendar</a>
      <a href="finance.html"  class="nav-link">finance</a>
      <a href="vibe.html"     class="nav-link">vibe</a>
    </div>
  </div>
</nav>

<main class="page">

  <header class="page-head">
    <div class="page-head-left">
      <div class="date-block">
        <span class="date-day" id="dateDay">SAT</span>
        <span class="date-num" id="dateNum">01</span>
        <span class="date-mo"  id="dateMo">AUG</span>
      </div>
      <div class="page-title-block">
        <span class="page-eyebrow">wordbook</span>
        <h1 class="page-title">smart girl <em>vocabulary.</em></h1>
      </div>
    </div>
    <div class="page-head-right">
      today's words<br>
      <span style="font-family: var(--font-accent); font-style: italic; font-weight: 900; color: var(--white); font-size: 1.5rem;">5 new</span>
    </div>
  </header>

  <div class="wb-progress">
    <span class="section-label">this week</span>
    <div class="wb-dots" id="weekDots"></div>
  </div>

  <section class="wb-cards" id="wordCards"></section>

  <section class="wb-stash">
    <div class="wb-stash-head">
      <span class="section-label">the stash</span>
      <span class="wb-stash-count" id="stashCount">0 words learned</span>
    </div>
    <div class="wb-stash-list" id="stashList">
      <p class="wb-stash-empty">no words in your stash yet. tap "got it" on any word above.</p>
    </div>
  </section>

</main>

<footer class="page-footer">
  <p>vocab that actually sticks.</p>
</footer>

<script src="wordbook-data.js"></script>
<script src="script.js"></script>
<script src="wordbook.js"></script>
</body>
</html>
