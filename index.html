<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Speak — sound like you mean it</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800;900&family=Bodoni+Moda:ital,wght@0,700;0,900;1,700;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-shapes" aria-hidden="true">
  <span class="shape shape-1"></span>
  <span class="shape shape-2"></span>
  <span class="shape shape-3"></span>
  <span class="shape shape-4"></span>
</div>

<div class="floating-words" aria-hidden="true">
  <span class="fw fw-1">no cap</span>
  <span class="fw fw-2">slay</span>
  <span class="fw fw-3">bet</span>
  <span class="fw fw-4">iykyk</span>
  <span class="fw fw-5">fr fr</span>
  <span class="fw fw-6">lowkey</span>
</div>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 40 40" width="32" height="32">
        <defs>
          <linearGradient id="lipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF3D8B"/>
            <stop offset="100%" stop-color="#B8306B"/>
          </linearGradient>
        </defs>
        <path d="M20 12 C 15 6, 6 8, 6 16 C 6 22, 12 28, 20 34 C 28 28, 34 22, 34 16 C 34 8, 25 6, 20 12 Z" fill="url(#lipGrad)"/>
        <path d="M20 12 C 18 14, 18 16, 20 18 C 22 16, 22 14, 20 12 Z" fill="#0A0A0A" opacity="0.35"/>
      </svg>
    </span>
    <span class="brand-name">Daily Speak</span>
  </div>

  <div class="topbar-right">
    <button class="archive-toggle" id="archiveToggle" type="button">
      <span>Past</span>
      <span class="archive-arrow">▾</span>
    </button>
    <div class="streak-pill" id="streakPill">
      <span class="streak-flame">🔥</span>
      <span id="streakCount">0</span>
    </div>
  </div>
</header>

<main class="page">

  <section class="hero">
    <p class="eyebrow" id="todayDate">Today's practice</p>
    <h1>Sound like you <em>mean it.</em></h1>
    <p class="hero-sub">Real clip. Real transcript. Say it like they say it.</p>
  </section>

  <!-- MAIN CONTENT: video + transcript + highlights -->
  <section class="lesson">

    <div class="lesson-header">
      <div class="scene-tag">
        <span class="scene-label">Scene</span>
        <span class="scene-text" id="sceneText"></span>
      </div>
      <div class="channel-badge" id="channelBadge"></div>
    </div>

    <div class="lesson-body">

      <!-- LEFT: video -->
      <div class="video-column">
        <div class="video-frame" id="videoFrame"></div>
      </div>

      <!-- RIGHT: transcript -->
      <div class="transcript-column">
        <p class="section-label">Transcript</p>
        <div class="transcript" id="transcript"></div>
      </div>

    </div>

    <!-- Below: highlighted phrases -->
    <div class="highlights" id="highlights"></div>

  </section>

</main>

<!-- Floating practice widget (bottom right) -->
<div class="practice-widget" id="practiceWidget">
  <div class="practice-widget-inner">
    <p class="pw-title">Say it out loud</p>
    <div class="pw-dots" id="repeatTracker">
      <button class="repeat-dot" data-rep="1" type="button" aria-label="Repeat 1"></button>
      <button class="repeat-dot" data-rep="2" type="button" aria-label="Repeat 2"></button>
      <button class="repeat-dot" data-rep="3" type="button" aria-label="Repeat 3"></button>
    </div>
    <button class="checkin-btn-mini" id="checkinBtn" type="button">Done today ✓</button>
  </div>
</div>

<!-- Archive drawer (hidden by default) -->
<div class="archive-drawer" id="archiveDrawer" aria-hidden="true">
  <div class="archive-drawer-inner">
    <div class="archive-drawer-head">
      <h3>Past lessons</h3>
      <button class="archive-close" id="archiveClose" type="button" aria-label="Close">✕</button>
    </div>
    <div class="archive-list" id="archiveList"></div>
  </div>
</div>

<footer class="page-footer">
  <p>Built for real ears. Not for textbooks.</p>
</footer>

<script src="lessons.js"></script>
<script src="script.js"></script>
</body>
</html>
