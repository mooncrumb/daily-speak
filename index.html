<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Speak — sound like you mean it</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800;900&family=Bodoni+Moda:ital,wght@0,700;0,900;1,700;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- background decoration -->
<div class="bg-shapes" aria-hidden="true">
  <span class="shape shape-1"></span>
  <span class="shape shape-2"></span>
  <span class="shape shape-3"></span>
  <span class="shape shape-4"></span>
</div>

<div class="floating-words" aria-hidden="true">
  <span class="fw fw-1">no cap</span>
  <span class="fw fw-2">slay</span>
  <span class="fw fw-3">bet</span>
  <span class="fw fw-4">iykyk</span>
  <span class="fw fw-5">fr fr</span>
  <span class="fw fw-6">lowkey</span>
</div>

<!-- SPEAK-O-METER: top wave bar, tracks today's practice -->
<div class="speak-o-meter" id="speakOMeter" aria-hidden="true">
  <svg class="wave-svg" viewBox="0 0 1200 40" preserveAspectRatio="none">
    <defs>
      <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%"  stop-color="#FF3D8B"/>
        <stop offset="50%" stop-color="#FFB4D1"/>
        <stop offset="100%" stop-color="#FF3D8B"/>
      </linearGradient>
    </defs>
    <!-- static baseline wave (dim) -->
    <path class="wave-base" d="M 0 20 Q 50 5, 100 20 T 200 20 T 300 20 T 400 20 T 500 20 T 600 20 T 700 20 T 800 20 T 900 20 T 1000 20 T 1100 20 T 1200 20" fill="none" stroke="rgba(255,180,209,0.15)" stroke-width="2"/>
    <!-- active fill wave, width driven by vibe -->
    <path class="wave-active" id="waveActive" d="M 0 20 Q 50 5, 100 20 T 200 20 T 300 20 T 400 20 T 500 20 T 600 20 T 700 20 T 800 20 T 900 20 T 1000 20 T 1100 20 T 1200 20" fill="none" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="1200" stroke-dashoffset="1200"/>
  </svg>
  <div class="vibe-label">
    <span class="vibe-text" id="vibeText">vibe: 0</span>
  </div>
</div>

<!-- ======= LEFT-ALIGNED MAGAZINE HEADER ======= -->
<header class="masthead">
  <div class="masthead-top">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 40 40" width="30" height="30">
        <defs>
          <linearGradient id="lipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF3D8B"/>
            <stop offset="100%" stop-color="#B8306B"/>
          </linearGradient>
        </defs>
        <path d="M20 12 C 15 6, 6 8, 6 16 C 6 22, 12 28, 20 34 C 28 28, 34 22, 34 16 C 34 8, 25 6, 20 12 Z" fill="url(#lipGrad)"/>
        <path d="M20 12 C 18 14, 18 16, 20 18 C 22 16, 22 14, 20 12 Z" fill="#0A0A0A" opacity="0.35"/>
      </svg>
    </span>
    <span class="brand-name">Daily Speak</span>
    <span class="masthead-divider">·</span>
    <span class="issue-num" id="issueNum">issue #001</span>
    <button class="past-toggle" id="pastToggle" type="button">past ↗</button>
  </div>

  <div class="masthead-headline">
    <div class="date-block">
      <span class="date-day" id="dateDay">SAT</span>
      <span class="date-num" id="dateNum">01</span>
      <span class="date-mo" id="dateMo">AUG</span>
    </div>
    <div class="mood-block">
      <span class="mood-label">today's mood</span>
      <span class="mood-quote" id="moodQuote">no cap fr fr</span>
    </div>
  </div>
</header>

<!-- ======= MAIN LESSON ======= -->
<main class="page">

  <section class="lesson">

    <div class="lesson-meta">
      <span class="scene-line" id="sceneText"></span>
      <span class="channel-badge" id="channelBadge"></span>
    </div>

    <div class="lesson-body">

      <!-- LEFT: video -->
      <div class="video-column">
        <div class="video-frame" id="videoFrame"></div>
        <p class="video-hint">▸ click any line on the right to jump the video</p>
      </div>

      <!-- RIGHT: syncing transcript -->
      <div class="transcript-column">
        <div class="transcript-head">
          <span class="section-label">live transcript</span>
          <span class="sync-dot" id="syncDot" title="synced with video"></span>
        </div>
        <div class="transcript" id="transcript"></div>
      </div>

    </div>

    <!-- Highlighted phrases -->
    <div class="highlights-head">
      <span class="section-label">phrases to steal</span>
    </div>
    <div class="highlights" id="highlights"></div>

  </section>

</main>

<!-- Archive drawer -->
<div class="archive-drawer" id="archiveDrawer" aria-hidden="true">
  <div class="archive-drawer-inner">
    <div class="archive-drawer-head">
      <h3>past issues</h3>
      <button class="archive-close" id="archiveClose" type="button" aria-label="Close">✕</button>
    </div>
    <div class="archive-list" id="archiveList"></div>
  </div>
</div>

<footer class="page-footer">
  <p>built for real ears. not for textbooks.</p>
</footer>

<!-- YouTube IFrame API -->
<script src="https://www.youtube.com/iframe_api"></script>
<script src="lessons.js"></script>
<script src="script.js"></script>
</body>
</html>
